<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">多头注意力的信息流</title><desc id="desc">八个头各自读取完整输入，分别投影和计算注意力，输出沿通道方向拼接，并经输出矩阵混合。只展开头一、头二和头八。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#496579"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#182f42;font-size:20px}.small{font-size:17px;fill:#486074}.box{fill:#edf6fa;stroke:#2381a1;stroke-width:1.5}.line{fill:none;stroke:#496579;stroke-width:2;marker-end:url(#a)}</style>
<rect width="720" height="560" rx="12" fill="#fff"/><text x="30" y="40" font-size="24" font-weight="bold">每个头都读取完整输入</text>
<rect class="box" x="200" y="65" width="320" height="50" rx="8"/><text x="360" y="97" text-anchor="middle">共同输入 X：S × 512</text>
<path class="line" d="M360 115V140H130V170"/><path class="line" d="M360 115V170"/><path class="line" d="M360 140H590V170"/>
<rect class="box" x="35" y="180" width="190" height="130" rx="8"/><text x="130" y="212" text-anchor="middle" font-weight="bold">头 1</text><text x="130" y="249" text-anchor="middle">自己的 Q、K、V</text><text x="130" y="282" text-anchor="middle">自己的 A₁V₁</text>
<rect class="box" x="265" y="180" width="190" height="130" rx="8"/><text x="360" y="212" text-anchor="middle" font-weight="bold">头 2</text><text x="360" y="249" text-anchor="middle">自己的 Q、K、V</text><text x="360" y="282" text-anchor="middle">自己的 A₂V₂</text>
<rect class="box" x="495" y="180" width="190" height="130" rx="8"/><text x="590" y="212" text-anchor="middle" font-weight="bold">… 头 8</text><text x="590" y="249" text-anchor="middle">自己的 Q、K、V</text><text x="590" y="282" text-anchor="middle">自己的 A₈V₈</text>
<text x="130" y="340" text-anchor="middle" class="small">S × 64</text><text x="360" y="340" text-anchor="middle" class="small">S × 64</text><text x="590" y="340" text-anchor="middle" class="small">S × 64</text>
<path class="line" d="M130 350V370H350V390"/><path class="line" d="M360 350V390"/><path class="line" d="M590 350V370H370V390"/>
<rect class="box" x="130" y="400" width="460" height="48" rx="8"/><text x="360" y="431" text-anchor="middle">8 个输出拼接：S × 512</text>
<path class="line" d="M360 448V476"/>
<rect x="130" y="485" width="460" height="48" rx="8" fill="#e6f3ed" stroke="#348167" stroke-width="1.5"/><text x="360" y="516" text-anchor="middle">乘 W<tspan baseline-shift="sub" font-size="13">O</tspan>（512 × 512）：混合各头通道</text>
</svg>
