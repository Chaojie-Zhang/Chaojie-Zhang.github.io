<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" role="img" aria-labelledby="title desc">
<title id="title">一个接收位置怎样读取其他位置</title>
<desc id="desc">bank 的查询与三个 key 比较得到注意力权重，随后加权混合三个 value。权重和数值为教学示例。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#496579"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#182f42;font-size:20px} .small{font-size:17px;fill:#486074}.box{fill:#edf6fa;stroke:#2381a1;stroke-width:1.5}.line{fill:none;stroke:#496579;stroke-width:2;marker-end:url(#a)}</style>
<rect width="720" height="570" rx="12" fill="#fff"/>
<text x="30" y="40" font-size="24" font-weight="bold">注意力：先匹配，再传递内容</text>
<rect class="box" x="210" y="65" width="300" height="48" rx="8"/><text x="360" y="96" text-anchor="middle">接收位置 bank 的 query</text>
<path class="line" d="M360 113V138H120V162"/><path class="line" d="M360 113V162"/><path class="line" d="M360 138H600V162"/>
<rect class="box" x="30" y="170" width="180" height="50" rx="8"/><text x="120" y="202" text-anchor="middle">river 的 key</text>
<rect class="box" x="270" y="170" width="180" height="50" rx="8"/><text x="360" y="202" text-anchor="middle">near 的 key</text>
<rect class="box" x="510" y="170" width="180" height="50" rx="8"/><text x="600" y="202" text-anchor="middle">bank 的 key</text>
<text x="360" y="251" text-anchor="middle" class="small">分别点积 → 缩放 → 按源位置做 softmax</text>
<path class="line" d="M120 268V298"/><path class="line" d="M360 268V298"/><path class="line" d="M600 268V298"/>
<text x="120" y="328" text-anchor="middle" font-weight="bold">0.7 × [10, 0]</text><text x="120" y="356" text-anchor="middle" class="small">权重 × river 的 value</text>
<text x="360" y="328" text-anchor="middle" font-weight="bold">0.1 × [0, 5]</text><text x="360" y="356" text-anchor="middle" class="small">权重 × near 的 value</text>
<text x="600" y="328" text-anchor="middle" font-weight="bold">0.2 × [2, 3]</text><text x="600" y="356" text-anchor="middle" class="small">权重 × bank 的 value</text>
<path class="line" d="M120 375V405H350V434"/><path class="line" d="M360 375V434"/><path class="line" d="M600 375V405H370V434"/>
<rect x="150" y="445" width="420" height="64" rx="8" fill="#e6f3ed" stroke="#348167" stroke-width="1.5"/>
<text x="360" y="484" text-anchor="middle" font-weight="bold">bank 的输出 = [7.4, 1.1]</text>
<text x="360" y="544" text-anchor="middle" class="small">位置数量没有减少：这里仅画出 bank 这一行的计算。</text>
</svg>
